<!DOCTYPE html>
<html>
<head>
<style> table {
border-collapse: collapse;
}
td, th {
border: 1px solid black; padding: 3px;
text-align: center;
}
th {
font-weight: bold; background-color: #E6E6E6;
}
</style>
<title>Calendar in JS</title>
</head>
<body>
<h2><center>CALENDAR</center></h2><br>

Year: <input id="y" type="number" name="year"><br/><br/> Month: <input id="m" type="number" name="month"><br/><br/>
<input type="button" value="Generate" onclick="createCalendar()"> <br><br>
<div id="cal"></div>
<script>
function createCalendar() {
var year = document.getElementById("y").value; var month = document.getElementById("m").value; if ( month < 1 || month > 12) {
alert("Please enter a valid year or month (1–12)."); return;
}
let mon = month - 1;
let d = new Date(year, mon); let table =
'<table><tr><th>SUN</th><th>MON</th><th>TUE</th><th>WED</th><th> THU</th><th>FRI</th><th>SAT</th></tr><tr>';
for (let i = 0; i < d.getDay(); i++) { table += '<td></td>';
}
while (d.getMonth() === mon) {
table += '<td>' + d.getDate() + '</td>'; if (d.getDay() === 6) {
table += '</tr><tr>';
}
d.setDate(d.getDate() + 1);
}

if (d.getDay() !== 0) {
for (let i = d.getDay(); i < 7; i++) { table += '<td></td>';
}
}
table += '</tr></table>'; document.getElementById("cal").innerHTML = table;
}
</script>
</body>
</html>
