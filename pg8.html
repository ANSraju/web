<!DOCTYPE html>
<body>
<button id="btn">Try it</button>
<p id="demo"></p>
<script>
var x = document.getElementById("btn"); x.addEventListener("mouseover", mouseOver); x.addEventListener("click", mouseClick); x.addEventListener("mouseout", mouseOut); x.addEventListener("dblclick", doubleClick); x.addEventListener("mousedown", MouseDown); x.addEventListener("mouseup", MouseUp); x.addEventListener("focus", Focus); x.addEventListener("blur", Blur);
function mouseOver() {
document.getElementById("demo").innerHTML += "Moused over!<br>";
}
function mouseClick() {
document.getElementById("demo").innerHTML += "Mouse clicked!<br>";
}

function mouseOut() {
document.getElementById("demo").innerHTML += "Mouse out!<br>";
}
function doubleClick() {
document.getElementById("demo").innerHTML += "Mouse double clicked!<br>";
}
function MouseDown() {
document.getElementById("demo").innerHTML += "Mouse button down!<br>";
}
function MouseUp() {
document.getElementById("demo").innerHTML += "Mouse button up!<br>";
}
function Focus() {
document.getElementById("demo").innerHTML += "Button focused!<br>";
}
function Blur() {
document.getElementById("demo").innerHTML += "Button lost focus!<br>";
}
</script>
</body>
