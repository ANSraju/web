<!DOCTYPE html>
<head>
<style> #container { width: 300px; height: 200px;
position: relative; margin: 20px auto;
}
#img1{
display: block;
}
#img2{
display: none;
}
</style>
</head>
<body>
<p>Make mouse over on image !...</p>
<div id='container'>

<img id="img1" src="image1.jpg">
<p id="p1">iam michael.</p>
<img id="img2" src="image2.png">
<p id="p2" style="display: none;">iam johnnny.</p>
</div>
<script>
const content = document.getElementById('container'); const image1 = document.getElementById('img1'); const image2 = document.getElementById('img2'); const para1 = document.getElementById('p1');
const para2 = document.getElementById('p2'); content.addEventListener('mouseover', () => { image1.style.display = 'none'; image2.style.display = 'block'; para1.style.display = 'none'; para2.style.display = 'block';
});
content.addEventListener('mouseout', () => { image2.style.display = 'none'; image1.style.display = 'block'; para2.style.display = 'none'; para1.style.display = 'block';
});
</script>
</body>
</html>
