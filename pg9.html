<!DOCTYPE html>
<head>
<style> body {
text-align: center;
}
</style>
</head>
<body>
<p>Click anywhere to change the background color!</p>
<script>
function getRandomColor() {
const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
const randomColor = colors[Math.floor(Math.random() * colors.length)]; return randomColor;
}
document.addEventListener("click", () => { document.body.style.backgroundColor = getRandomColor();
});
</script>
