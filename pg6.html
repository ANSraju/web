<!DOCTYPE html>
<body>
<h3>String Functions</h3>
<p id="s1"></p>
<p id="s2"></p>
<p id="s3"></p>
<p id="s4"></p>
<p id="s5"></p>
<p id="s6"></p>
<p id="s7"></p>
<head>
<script>
let txt = "Hello, World!"; let len=txt.length;
let part = txt.slice(5,13); let sub=txt.substr(5,6);
let newtxt=txt.replace("World","Universe");

let u=txt.toUpperCase(); let s=txt.toLowerCase();
let txt2=", Hello Everyone!"; let c=txt.concat(" ",txt2);
document.getElementById("s1").innerHTML = "Length: " + len; document.getElementById("s2").innerHTML = "Sliced: " + part; document.getElementById("s3").innerHTML = "Substr: " + sub; document.getElementById("s4").innerHTML = "Replaced: " + newtxt; document.getElementById("s5").innerHTML = "Uppercase: " + u; document.getElementById("s6").innerHTML = "Lowercase: " + s; document.getElementById("s7").innerHTML = "Concatenated: " + c; let m1 = Math.round(4.6);
let m2 = Math.pow(2,3); let m3 = Math.sqrt(49); let m4 = Math.abs(-25);
let m5 = Math.max(4,8,2,10); let m6 = Math.random();
let m7 = Math.min(4,8,2,10); let m8 = Math.floor(4.7);
let m9 = Math.ceil(4.2); let m10 = Math.PI;
let m11 = Math.sign(10); let m12 = Math.sign(-5); let m13 = Math.sign(0); let m14 = Math.log(10);
document.write("<h3>Math Functions</h3>");

document.write("Round(4.6): " + m1 + "<br><br>"); document.write("Power(2,3): " + m2 + "<br><br>"); document.write("Square Root(49): " + m3 + "<br><br>"); document.write("Absolute(-25): " + m4 + "<br><br>"); document.write("Maximum(4,8,2,10): " + m5 + "<br><br>"); document.write("Random: " + m6 + "<br><br>"); document.write("Minimum(4,8,2,10): " + m7 + "<br><br>"); document.write("Floor(4.7): " + m8 + "<br><br>"); document.write("Ceil(4.2): " + m9 + "<br><br>"); document.write("Value of PI: " + m10 + "<br><br>"); document.write("Sign(10): " + m11 + "<br><br>"); document.write("Sign(-5): " + m12 + "<br><br>"); document.write("Sign(0): " + m13 + "<br><br>"); document.write("Natural Logarithm of 10: " + m14 + "<br><br>");
</script>
</head>
</body>
